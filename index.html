<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Cassaforte</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#10203f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#14213d;--mu:#667189;--ln:#e1e5ee;--ac:#0f766e;--ac2:#0b5a54;--side:#10203f;--sx:#c9d3ea;--dg:#b42318;--ok:#15803d;--sh:0 1px 2px rgba(16,32,63,.06),0 4px 14px rgba(16,32,63,.05)}
[data-theme=dark]{--bg:#0c1224;--card:#151d36;--tx:#e8ecf7;--mu:#9aa5c4;--ln:#252f50;--ac:#2dd4bf;--ac2:#5eead4;--side:#080d1b;--sx:#aeb9d9;--dg:#f87171;--ok:#4ade80;--sh:none}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1{font:600 24px/1.2 Georgia,"Iowan Old Style",serif;margin:0}h2{font:600 19px Georgia,serif;margin:0 0 14px}
button{font:inherit;color:inherit;cursor:pointer}input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;width:100%}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{display:flex;min-height:100vh}.grow{flex:1}.row{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:14px}
.side{width:260px;background:var(--side);color:var(--sx);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.brand{display:flex;gap:10px;align-items:center;color:#fff;font:600 20px Georgia,serif;padding:4px 10px 16px}
.nav{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;padding:9px 10px;border-radius:10px;text-align:left;width:100%}
.nav span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav em{font-style:normal;font-size:12px;opacity:.7}
.nav:hover{background:rgba(255,255,255,.07)}.nav.on{background:rgba(45,212,191,.16);color:#fff}
.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 4px;font-size:13px;color:#8fa0c8}
.side .icon{color:#fff}main{flex:1;min-width:0;padding:18px 28px}
header{display:flex;gap:10px;align-items:center;margin-bottom:22px}.search{flex:1;position:relative;max-width:520px}
.search svg{position:absolute;left:12px;top:11px;color:var(--mu)}.search input{padding-left:36px}
.btn{display:inline-flex;gap:6px;align-items:center;justify-content:center;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;white-space:nowrap}
[data-theme=dark] .btn{color:#06201c}.btn:hover{background:var(--ac2)}.btn.ghost{background:none;color:var(--tx);border:1px solid var(--ln)}.btn.ghost:hover{background:var(--bg)}
.btn.danger{background:var(--dg);color:#fff}.btn.wide{width:100%;margin-top:10px}.btn:disabled{opacity:.6}
.icon{display:inline-grid;place-items:center;width:34px;height:34px;border:0;background:none;border-radius:8px;color:var(--mu);flex:none}
.icon:hover,.icon.on{background:var(--bg);color:var(--tx)}.menu{display:none}
.bar{display:flex;gap:6px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.bar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:var(--sh)}
.av{width:42px;height:42px;border-radius:12px;color:#fff;display:grid;place-items:center;font-weight:700;flex:none;cursor:pointer}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;cursor:pointer}.meta b,.meta span,.meta code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta small{color:var(--mu)}.meta span{color:var(--mu);font-size:14px}.meta code{font-size:13px;letter-spacing:1px}
.acts{display:flex;flex-wrap:wrap;max-width:76px;justify-content:flex-end}.list .acts{max-width:none;flex-wrap:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px}.stat b{display:block;font:600 30px Georgia,serif;color:var(--ac)}
.panel{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:18px;max-width:720px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--ln);background:var(--card);border-radius:99px;padding:5px 14px}.chip:hover{border-color:var(--ac)}
.empty{text-align:center;padding:60px 20px;color:var(--mu);border:1px dashed var(--ln);border-radius:16px}.empty h2{color:var(--tx)}
.back{position:fixed;inset:0;background:rgba(8,13,27,.55);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
#dialog .back{z-index:30}.dlg{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .15s ease-out}.dlg.sm{max-width:420px}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.fld{margin-bottom:12px}.fld label,.gp label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}.gp label.chk{display:inline-flex;gap:6px;align-items:center;margin:6px 12px 0 0;color:var(--tx)}.gp label.chk input{width:auto}
.in{display:flex;gap:4px}.err{color:var(--dg);font-size:13px;min-height:18px}.gp{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:12px}
.meter{height:6px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0 2px}.meter i{display:block;height:100%;width:0;transition:width .2s}
small{color:var(--mu)}.dl{display:grid;grid-template-columns:110px 1fr auto;gap:6px 8px;align-items:center}.dl dt{color:var(--mu);font-size:13px}.dl dd{margin:0;word-break:break-word}
.alert{padding:10px 12px;border-radius:10px;background:var(--bg);margin-bottom:8px;border-left:3px solid var(--ac)}.alert.w{border-color:#d97706}
.auth{flex:1;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--side),#0b3b3a)}
.acard{background:var(--card);border-radius:20px;padding:32px;width:100%;max-width:400px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.acard svg{color:var(--ac)}.acard p{color:var(--mu)}.acard input{margin-top:10px}.link{background:none;border:0;color:var(--ac);margin-top:14px;text-decoration:underline}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--side);color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:340px;border-left:4px solid var(--ac);animation:pop .15s}.toast.err{border-color:var(--dg)}
ul.n{margin:6px 0 0;padding-left:18px;color:var(--mu)}
.ni{display:block;border-radius:10px}.ni.over,.card.over{outline:2px dashed var(--ac);outline-offset:2px}.dragging{opacity:.45}.ni[draggable=true],.card[draggable=true]{cursor:grab}.mv{display:flex;flex-direction:column;flex:none;margin-left:-6px}.mv .icon{width:26px;height:22px}.icon:disabled{opacity:.3;cursor:default}.icon:disabled:hover{background:none}
@media(max-width:820px){.side{position:fixed;z-index:15;transform:translateX(-100%);transition:transform .2s}.side.open{transform:none}.menu{display:inline-grid}main{padding:14px}.btn.add span{display:none}.dl{grid-template-columns:90px 1fr auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="dialog"></div><div id="toasts" role="status" aria-live="polite"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
'use strict';
const $=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder(),ITER=600000;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64=u=>{let s='';for(const b of new Uint8Array(u))s+=String.fromCharCode(b);return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const uid=()=>crypto.randomUUID?crypto.randomUUID():b64(crypto.getRandomValues(new Uint8Array(12)));
const I={eye:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',eyeoff:'<path d="M9.9 4.2A10 10 0 0 1 12 5c7 0 10 7 10 7a13 13 0 0 1-1.7 2.7M6.6 6.6A13 13 0 0 0 2 12s3 7 10 7a10 10 0 0 0 5.4-1.6"/><path d="m2 2 20 20"/>',copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',pencil:'<path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',trash:'<path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',plus:'<path d="M5 12h14M12 5v14"/>',lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',dice:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>',home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>',folder:'<path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',chevup:'<path d="m18 15-6-6-6 6"/>',chevdown:'<path d="m6 9 6 6 6-6"/>'};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h} 50% 38%)`};
const fmt=t=>new Date(t).toLocaleString('it-IT',{dateStyle:'medium',timeStyle:'short'});

/* ---------- Crypto: PBKDF2-SHA256 (600k) -> AES-256-GCM, IV casuale a ogni salvataggio ---------- */
async function derive(pw,salt,it){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));return{iv:b64(iv),ct:b64(ct)}}
async function open(key,box){return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},key,unb64(box.ct))))}

/* ---------- Storage: IndexedDB, solo dati cifrati ---------- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('cassaforte',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const dbGet=async k=>{const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const dbPut=async(k,v)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
async function persist(){const box=await seal(S.key,S.data);S.rec={...S.rec,...box};await dbPut('vault',S.rec)}

/* ---------- Stato ---------- */
const defaults=()=>({cats:[['email','Email'],['social','Social network'],['stream','Streaming e intrattenimento'],['bank','Banche e finanze'],['work','Lavoro'],['shop','Shopping'],['game','Gaming'],['other','Altro']].map(([id,name])=>({id,name})),creds:[],settings:{lock:5}});
const S={rec:null,key:null,data:null,view:'dash',q:'',sort:'manual',layout:'grid',rev:new Set(),gen:{len:20,lo:1,up:1,di:1,sy:1},gout:''};
let dirty=false,last=Date.now();
const app=$('#app'),dark=()=>document.documentElement.dataset.theme==='dark';
function toast(m,t){const d=document.createElement('div');d.className='toast '+(t||'');d.textContent=m;$('#toasts').append(d);setTimeout(()=>d.remove(),4000)}
function lock(msg){S.key=null;S.data=null;S.q='';S.rev.clear();S.gout='';$('#modal').innerHTML='';$('#dialog').innerHTML='';render();if(msg)toast(msg)}
function start(){last=Date.now();S.view='dash';S.q='';render()}

/* ---------- Password: generatore e stima ---------- */
function rnd(n){const m=Math.floor(2**32/n)*n;let x;do{x=crypto.getRandomValues(new Uint32Array(1))[0]}while(x>=m);return x%n}
function generate(){const g=S.gen,sets=[];if(g.lo)sets.push('abcdefghijkmnopqrstuvwxyz');if(g.up)sets.push('ABCDEFGHJKLMNPQRSTUVWXYZ');if(g.di)sets.push('23456789');if(g.sy)sets.push('!@#$%^&*-_=+?');
 if(!sets.length){g.lo=1;sets.push('abcdefghijkmnopqrstuvwxyz')}const all=sets.join(''),out=sets.map(s=>s[rnd(s.length)]);
 while(out.length<g.len)out.push(all[rnd(all.length)]);for(let i=out.length-1;i>0;i--){const j=rnd(i+1);[out[i],out[j]]=[out[j],out[i]]}return out.join('')}
function strength(p){let pool=0;if(/[a-z]/.test(p))pool+=26;if(/[A-Z]/.test(p))pool+=26;if(/\d/.test(p))pool+=10;if(/[^A-Za-z0-9]/.test(p))pool+=32;const bits=p.length*Math.log2(pool||1);
 return bits<40?['Debole',bits,'#dc2626']:bits<60?['Discreta',bits,'#d97706']:bits<80?['Buona',bits,'#65a30d']:['Molto buona',bits,'#16a34a']}
function meter(bar,lab,p){const b=$('#'+bar),l=$('#'+lab);if(!b)return;if(!p){b.style.width='0';l.textContent='';return}const[t,bits,c]=strength(p);b.style.width=Math.min(100,bits)+'%';b.style.background=c;l.textContent=`${t} · ~${Math.round(bits)} bit (stima indicativa, non una garanzia)`}
function genRun(){S.gout=generate();const o=$('#g-out');if(o)o.value=S.gout;meter('g-bar','g-lab',S.gout)}
function genPanel(){const g=S.gen;return`<div class="gp"><div class="in"><input id="g-out" readonly aria-label="Password generata" value="${esc(S.gout)}"><button class="icon" data-act="gregen" aria-label="Rigenera">${ic('dice')}</button><button class="icon" data-act="gcopy" aria-label="Copia">${ic('copy')}</button></div>
<label style="margin-top:10px">Lunghezza: <b id="g-lv">${g.len}</b></label><input type="range" min="8" max="64" value="${g.len}" data-gen="len">
${[['lo','a-z'],['up','A-Z'],['di','0-9'],['sy','!@#$']].map(([k,l])=>`<label class="chk"><input type="checkbox" data-gen="${k}" ${g[k]?'checked':''}>${l}</label>`).join('')}
<div class="meter"><i id="g-bar"></i></div><small id="g-lab"></small></div>`}

/* ---------- Clipboard ---------- */
async function copy(t,what){try{await navigator.clipboard.writeText(t);toast(`${what} copiato. Resta negli appunti: verrà svuotato tra 30 s, ma altre app potrebbero averlo letto.`);clearTimeout(S.ct);S.ct=setTimeout(()=>navigator.clipboard.writeText('').catch(()=>{}),30000)}catch{toast('Copia non riuscita: il browser ha negato l\'accesso agli appunti.','err')}}

/* ---------- Dialoghi ---------- */
function ask(o){return new Promise(res=>{const d=$('#dialog');d.innerHTML=`<div class="back"><div class="dlg sm" role="alertdialog" aria-modal="true"><h2>${esc(o.title)}</h2>${o.msg?`<p>${esc(o.msg)}</p>`:''}${o.select?`<select id="d-in">${o.select.map(x=>`<option value="${esc(x.id)}" ${x.id===o.value?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:o.input?`<input id="d-in" type="${o.type||'text'}" value="${esc(o.value||'')}" autocomplete="off">`:''}<div class="row"><button class="btn ghost" id="d-no">Annulla</button><button class="btn ${o.danger?'danger':''}" id="d-ok">${esc(o.ok||'Conferma')}</button></div></div></div>`;
 const done=v=>{d.innerHTML='';res(v)},inp=$('#d-in');($('#d-in')||$('#d-no')).focus();$('#d-no').onclick=()=>done(null);$('#d-ok').onclick=()=>done(inp?inp.value:true);
 d.onkeydown=e=>{if(e.key==='Escape'){e.stopPropagation();done(null)}if(e.key==='Enter'&&inp)$('#d-ok').click()}})}
function modal(html){$('#modal').innerHTML=`<div class="back"><div class="dlg" role="dialog" aria-modal="true">${html}</div></div>`;dirty=false}
const closeModal=()=>{$('#modal').innerHTML='';dirty=false};
async function tryClose(){if(dirty&&!await ask({title:'Chiudere senza salvare?',msg:'Le modifiche inserite andranno perse.',ok:'Chiudi senza salvare',danger:1}))return;closeModal()}

/* ---------- Viste ---------- */
function authView(){const nu=!S.rec;
 app.innerHTML=`<div class="auth"><div class="acard">${ic('shield',38)}<h1>Cassaforte</h1><p>${nu?'Crea la tua master password. Non esiste recupero: se la dimentichi, i dati restano illeggibili.':'Inserisci la master password per sbloccare.'}</p>
 <form id="af"><input id="a-pw" type="password" autocomplete="${nu?'new-password':'current-password'}" placeholder="Master password" aria-label="Master password">
 ${nu?'<input id="a-pw2" type="password" autocomplete="new-password" placeholder="Ripeti la master password" aria-label="Ripeti la master password"><div class="meter"><i id="a-bar"></i></div><small id="a-lab"></small>':''}
 <div class="err" id="a-err" role="alert"></div><button class="btn wide" id="a-go">${nu?'Crea cassaforte':'Sblocca'}</button></form>
 <button class="link" data-act="import">Ripristina da backup cifrato</button></div></div>`;
 $('#a-pw').focus();
 $('#af').onsubmit=async e=>{e.preventDefault();const pw=$('#a-pw').value,err=m=>$('#a-err').textContent=m,go=$('#a-go');
  if(nu){if(pw.length<12)return err('Servono almeno 12 caratteri: meglio una frase lunga.');if(pw!==$('#a-pw2').value)return err('Le due password non coincidono.')}else if(!pw)return err('Inserisci la master password.');
  go.disabled=true;go.textContent='Derivazione della chiave…';err('');
  try{if(nu){const salt=crypto.getRandomValues(new Uint8Array(16));S.key=await derive(pw,salt,ITER);S.rec={v:1,kdf:'PBKDF2-SHA256',iter:ITER,salt:b64(salt)};S.data=defaults();await persist()}
   else{const k=await derive(pw,unb64(S.rec.salt),S.rec.iter);S.data=await open(k,S.rec);S.data.settings??={lock:5};S.key=k}}
  catch{S.key=null;S.data=null;if(nu)S.rec=null;go.disabled=false;go.textContent=nu?'Crea cassaforte':'Sblocca';return err(nu?'Impossibile salvare nel browser (IndexedDB non disponibile?).':'Master password errata o dati non leggibili.')}
  start()}}
function render(){if(!S.data)return authView();const d=S.data,n=id=>id==='all'?d.creds.length:d.creds.filter(c=>c.cat===id).length;
 const nav=(v,i,l,c)=>`<button class="nav ${S.view===v?'on':''}" data-act="view" data-v="${v}">${ic(i)}<span>${l}</span>${c!=null?`<em>${c}</em>`:''}</button>`;
 app.innerHTML=`<aside class="side" id="side"><div class="brand">${ic('shield',24)} Cassaforte</div>${nav('dash','home','Dashboard')}${nav('gen','dice','Generatore')}
 <div class="sec">Categorie <button class="icon" data-act="catnew" aria-label="Nuova categoria">${ic('plus',16)}</button></div>${nav('cat:all','folder','Tutte le credenziali',n('all'))}
 ${d.cats.map(c=>`<div class="ni" draggable="true" data-catid="${c.id}">${nav('cat:'+c.id,'folder',esc(c.name),n(c.id))}</div>`).join('')}<div class="grow"></div>${nav('settings','sliders','Impostazioni')}<button class="nav" data-act="lock">${ic('lock')}<span>Blocca la cassaforte</span></button></aside>
 <main><header><button class="icon menu" data-act="menu" aria-label="Menu">${ic('menu')}</button><div class="search">${ic('search',16)}<input id="q" type="search" placeholder="Cerca per servizio o utente" value="${esc(S.q)}" aria-label="Cerca" autocomplete="off"></div>
 <button class="icon" data-act="theme" aria-label="Cambia tema">${ic(dark()?'sun':'moon')}</button><button class="btn add" data-act="add">${ic('plus',16)}<span>Aggiungi credenziale</span></button></header><section id="content"></section></main>`;
 content();if(S.focusQ){const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length);S.focusQ=0}}
function content(){const v=S.view;$('#content').innerHTML=v==='dash'?dash():v==='gen'?genView():v==='settings'?settingsView():catView();if(v==='gen')genRun()}
const catName=id=>S.data.cats.find(c=>c.id===id)?.name||'—';
function card(c,mv){const sh=S.rev.has(c.id);return`<article class="card" ${mv?`draggable="true" data-cid="${c.id}"`:''}>${mv?`<div class="mv"><button class="icon" data-act="cup" data-id="${c.id}" aria-label="Sposta su" ${mv.first?'disabled':''}>${ic('chevup',14)}</button><button class="icon" data-act="cdown" data-id="${c.id}" aria-label="Sposta giù" ${mv.last?'disabled':''}>${ic('chevdown',14)}</button></div>`:''}<div class="av" style="background:${hue(c.name)}" data-act="open" data-id="${c.id}">${esc(c.name.trim()[0]?.toUpperCase()||'?')}</div>
 <div class="meta" data-act="open" data-id="${c.id}"><b>${esc(c.name)}</b><small>${esc(catName(c.cat))}</small><span>${esc(c.user)}</span><code>${sh?esc(c.pass):'••••••••••'}</code></div>
 <div class="acts"><button class="icon" data-act="reveal" data-id="${c.id}" aria-label="${sh?'Nascondi':'Mostra'} password">${ic(sh?'eyeoff':'eye',16)}</button><button class="icon" data-act="cpass" data-id="${c.id}" aria-label="Copia password">${ic('copy',16)}</button>
 <button class="icon" data-act="edit" data-id="${c.id}" aria-label="Modifica">${ic('pencil',16)}</button><button class="icon" data-act="del" data-id="${c.id}" aria-label="Elimina">${ic('trash',16)}</button></div></article>`}
function emptyBox(){return S.data.creds.length?`<div class="empty"><h2>Nessun risultato</h2><p>Prova con un altro termine o un'altra categoria.</p></div>`:`<div class="empty"><h2>La cassaforte è vuota</h2><p>Salva la prima credenziale: verrà cifrata su questo dispositivo.</p><button class="btn" data-act="add">${ic('plus',16)} Aggiungi credenziale</button></div>`}
function dash(){const cr=S.data.creds,rec=[...cr].sort((a,b)=>b.updated-a.updated).slice(0,5),cnt={};cr.forEach(c=>cnt[c.pass]=(cnt[c.pass]||0)+1);
 const reuse=cr.filter(c=>cnt[c.pass]>1),weak=cr.filter(c=>strength(c.pass)[1]<50),al=[];
 if(reuse.length)al.push(`<div class="alert w">${reuse.length} credenziali condividono la stessa password: ${reuse.slice(0,4).map(c=>esc(c.name)).join(', ')}${reuse.length>4?'…':''}.</div>`);
 if(weak.length)al.push(`<div class="alert w">${weak.length} password hanno una robustezza stimata bassa: ${weak.slice(0,4).map(c=>esc(c.name)).join(', ')}${weak.length>4?'…':''}.</div>`);
 return`<h1 style="margin-bottom:16px">Dashboard</h1><div class="stats"><div class="stat"><b>${cr.length}</b>credenziali salvate</div><div class="stat"><b>${S.data.cats.length}</b>categorie</div></div>
 <div class="panel"><h2>Categorie</h2><div class="chips">${S.data.cats.map(c=>`<button class="chip" data-act="view" data-v="cat:${c.id}">${esc(c.name)} · ${cr.filter(x=>x.cat===c.id).length}</button>`).join('')}</div></div>
 <div class="panel"><h2>Avvisi</h2>${al.join('')||'<p style="margin:0;color:var(--mu)">Nessun problema rilevato.</p>'}<small>Controlli attivi: solo password riutilizzate e password deboli (stima locale). Non verifica se le password sono apparse in data breach.</small></div>
 <h2>Aggiunte o modificate di recente</h2>${rec.length?`<div class="list">${rec.map(c=>card(c)).join('')}</div>`:emptyBox()}`}
function visible(id){const q=S.q.toLowerCase(),l=S.data.creds.filter(c=>(id==='all'||c.cat===id)&&(!q||(c.name+' '+c.user).toLowerCase().includes(q)));l.sort({manual:()=>0,name:(a,b)=>a.name.localeCompare(b.name,'it'),created:(a,b)=>b.created-a.created,updated:(a,b)=>b.updated-a.updated}[S.sort]);return l}
function catView(){const id=S.view.slice(4),all=id==='all',cat=S.data.cats.find(c=>c.id===id);if(!all&&!cat){S.view='dash';return dash()}
 const l=visible(id),man=S.sort==='manual';
 
 return`<div class="bar"><h1>${all?'Tutte le credenziali':esc(cat.name)}</h1>${cat?`<button class="icon" data-act="catup" data-id="${id}" aria-label="Sposta la categoria più in alto" ${S.data.cats[0]===cat?'disabled':''}>${ic('chevup',16)}</button><button class="icon" data-act="catdown" data-id="${id}" aria-label="Sposta la categoria più in basso" ${S.data.cats.at(-1)===cat?'disabled':''}>${ic('chevdown',16)}</button><button class="icon" data-act="catren" data-id="${id}" aria-label="Rinomina categoria">${ic('pencil',16)}</button><button class="icon" data-act="catdel" data-id="${id}" aria-label="Elimina categoria">${ic('trash',16)}</button>`:''}<span class="grow"></span>
 <select id="sort" aria-label="Ordina per"><option value="manual" ${S.sort==='manual'?'selected':''}>Ordine personalizzato</option><option value="name" ${S.sort==='name'?'selected':''}>Ordine alfabetico</option><option value="created" ${S.sort==='created'?'selected':''}>Data di inserimento</option><option value="updated" ${S.sort==='updated'?'selected':''}>Ultima modifica</option></select>
 <button class="icon ${S.layout==='grid'?'on':''}" data-act="layout" data-l="grid" aria-label="Schede">${ic('grid')}</button><button class="icon ${S.layout==='list'?'on':''}" data-act="layout" data-l="list" aria-label="Elenco">${ic('list')}</button></div>
 ${man&&l.length?'<small>Trascina le schede o usa le frecce per cambiare l\'ordine.</small>':''}${l.length?`<div class="${S.layout}" style="margin-top:8px">${l.map((c,i)=>card(c,man&&{first:!i,last:i===l.length-1})).join('')}</div>`:emptyBox()}`}
const genView=()=>`<h1 style="margin-bottom:16px">Generatore di password</h1><div class="panel">${genPanel()}</div>`;
function settingsView(){const m=S.data.settings.lock;return`<h1 style="margin-bottom:16px">Impostazioni</h1>
 <div class="panel"><h2>Blocco automatico</h2><select id="lockm" aria-label="Blocco automatico">${[[1,'1 minuto'],[5,'5 minuti'],[15,'15 minuti'],[30,'30 minuti'],[60,'1 ora'],[0,'Mai (sconsigliato)']].map(([v,l])=>`<option value="${v}" ${m===v?'selected':''}>${l}</option>`).join('')}</select></div>
 <div class="panel"><h2>Backup cifrato</h2><p>Il file contiene solo dati cifrati e si apre con la master password usata al momento del backup. Conservalo in un luogo sicuro.</p><div class="row" style="justify-content:flex-start"><button class="btn" data-act="export">Esporta backup</button><button class="btn ghost" data-act="import">Ripristina da backup</button></div></div>
 <div class="panel"><h2>Come è protetta</h2><ul class="n"><li>Cifratura AES-256-GCM con IV casuale a ogni salvataggio; l'intero archivio (anche nomi e categorie) è cifrato.</li><li>Chiave derivata dalla master password con PBKDF2-SHA256, 600.000 iterazioni, salt casuale di 16 byte.</li><li>Master password e chiave non vengono salvate: la chiave esiste solo in memoria finché la cassaforte è sbloccata.</li><li>Nessuna richiesta di rete: la pagina blocca ogni connessione esterna tramite Content-Security-Policy.</li><li>Limite: non protegge da malware sul dispositivo, estensioni del browser malevole o keylogger.</li></ul></div>`}

/* ---------- Dettaglio e form ---------- */
function openDetail(id){const c=S.data.creds.find(x=>x.id===id);if(!c)return;let url=null;try{const u=new URL(c.url);if(/^https?:$/.test(u.protocol))url=u.href}catch{}
 modal(`<h2>${esc(c.name)}</h2><dl class="dl"><dt>Categoria</dt><dd>${esc(catName(c.cat))}</dd><span></span>
 <dt>Utente</dt><dd>${esc(c.user)}</dd><button class="icon" data-act="cuser" data-id="${id}" aria-label="Copia utente">${ic('copy',16)}</button>
 <dt>Password</dt><dd id="m-pass">••••••••••</dd><span><button class="icon" data-act="mreveal" data-id="${id}" aria-label="Mostra o nascondi password">${ic('eye',16)}</button><button class="icon" data-act="cpass" data-id="${id}" aria-label="Copia password">${ic('copy',16)}</button></span>
 <dt>Sito</dt><dd>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`:'—'}</dd><span></span><dt>Note</dt><dd>${esc(c.notes)||'—'}</dd><span></span>
 <dt>Creata</dt><dd>${fmt(c.created)}</dd><span></span><dt>Modificata</dt><dd>${fmt(c.updated)}</dd><span></span></dl>
 <div class="row"><button class="btn ghost" data-act="mclose">Chiudi</button><button class="btn ghost" data-act="del" data-id="${id}">Elimina</button><button class="btn" data-act="edit" data-id="${id}">Modifica</button></div>`)}
function openForm(id){const c=id?S.data.creds.find(x=>x.id===id):null,f=(k,l,v,x='')=>`<div class="fld"><label for="f-${k}">${l}</label><input id="f-${k}" value="${esc(v)}" ${x}><div class="err" id="e-${k}"></div></div>`;
 modal(`<h2>${c?'Modifica credenziale':'Nuova credenziale'}</h2>${f('name','Servizio *',c?.name,'maxlength="80" autocomplete="off"')}
 <div class="fld"><label for="f-user">Email, username o codice *</label><div class="in"><input id="f-user" value="${esc(c?.user)}" autocomplete="off" maxlength="200"><button class="icon" data-act="fcopy" data-t="f-user" aria-label="Copia utente">${ic('copy',16)}</button></div><div class="err" id="e-user"></div></div>
 <div class="fld"><label for="f-pass">Password o PIN *</label><div class="in"><input id="f-pass" type="password" value="${esc(c?.pass)}" autocomplete="new-password"><button class="icon" data-act="fshow" aria-label="Mostra o nascondi">${ic('eye',16)}</button><button class="icon" data-act="fgen" aria-label="Genera password">${ic('dice',16)}</button><button class="icon" data-act="fcopy" data-t="f-pass" aria-label="Copia password">${ic('copy',16)}</button></div>
 <div class="meter"><i id="f-bar"></i></div><small id="f-lab"></small><div class="err" id="e-pass"></div></div><div id="gp" hidden></div>
 <div class="fld"><label for="f-cat">Categoria *</label><select id="f-cat">${S.data.cats.map(k=>`<option value="${k.id}" ${(c?c.cat:S.view.startsWith('cat:')&&S.view!=='cat:all'?S.view.slice(4):S.data.cats.some(x=>x.id==='other')?'other':S.data.cats[0].id)===k.id?'selected':''}>${esc(k.name)}</option>`).join('')}</select></div>
 ${f('url','Sito web',c?.url,'type="url" placeholder="https://" autocomplete="off"')}<div class="fld"><label for="f-notes">Note</label><textarea id="f-notes" rows="3" maxlength="2000">${esc(c?.notes)}</textarea></div>
 <div class="row"><button class="btn ghost" data-act="mclose">Annulla</button><button class="btn" data-act="save" data-id="${id||''}">Salva</button></div>`);
 meter('f-bar','f-lab',c?.pass||'');$('#f-name').focus()}
async function save(id){const v=k=>$('#f-'+k).value.trim(),E=(k,m)=>$('#e-'+k).textContent=m||'';let ok=1;['name','user','pass','url'].forEach(k=>E(k));
 if(!v('name')){E('name','Inserisci il nome del servizio.');ok=0}if(!v('user')){E('user','Inserisci email, username o codice.');ok=0}if(!$('#f-pass').value){E('pass','Inserisci una password o un PIN.');ok=0}
 let url=v('url');if(url){if(!/^[a-z]+:\/\//i.test(url))url='https://'+url;try{if(!/^https?:$/.test(new URL(url).protocol))throw 0}catch{E('url','URL non valido.');ok=0}}if(!ok)return;
 const o={name:v('name'),user:v('user'),pass:$('#f-pass').value,cat:$('#f-cat').value,url,notes:$('#f-notes').value.trim(),updated:Date.now()};
 if(id)Object.assign(S.data.creds.find(c=>c.id===id),o);else S.data.creds.push({id:uid(),created:Date.now(),...o});
 try{await persist()}catch{return toast('Salvataggio non riuscito.','err')}
 closeModal();render();toast(id?'Credenziale aggiornata.':'Credenziale salvata.')}
async function delCred(id){const c=S.data.creds.find(x=>x.id===id);if(!c||!await ask({title:`Eliminare «${c.name}»?`,msg:`Verrà eliminata la credenziale ${c.user}. L'operazione non è reversibile.`,ok:'Elimina',danger:1}))return;
 S.data.creds=S.data.creds.filter(x=>x.id!==id);await persist();closeModal();render();toast('Credenziale eliminata.')}

/* ---------- Categorie ---------- */
function catErr(n,except){n=n.trim();if(!n||n.length>40)return'Il nome deve avere da 1 a 40 caratteri.';if(/^tutte le credenziali$/i.test(n)||S.data.cats.some(c=>c.id!==except&&c.name.toLowerCase()===n.toLowerCase()))return'Esiste già una categoria con questo nome.'}
async function catNew(){const n=await ask({title:'Nuova categoria',input:1,ok:'Crea'});if(n==null)return;const e=catErr(n);if(e)return toast(e,'err');const id=uid();S.data.cats.push({id,name:n.trim(),custom:1});await persist();S.view='cat:'+id;render();toast('Categoria creata.')}
async function catRen(id){const c=S.data.cats.find(x=>x.id===id),n=await ask({title:'Rinomina categoria',input:1,value:c.name,ok:'Salva'});if(n==null)return;const e=catErr(n,id);if(e)return toast(e,'err');c.name=n.trim();await persist();render();toast('Categoria rinominata.')}
async function catDel(id){const c=S.data.cats.find(x=>x.id===id),k=S.data.creds.filter(x=>x.cat===id).length;
 if(S.data.cats.length<2)return toast('Deve restare almeno una categoria: creane un\'altra prima di eliminare questa.','err');
 const rest=S.data.cats.filter(x=>x.id!==id);let dest=null;
 if(k){dest=await ask({title:`Eliminare «${c.name}»?`,msg:`Contiene ${k} credenziali: scegli la categoria in cui spostarle. Non verranno eliminate.`,select:rest,value:(rest.find(x=>x.id==='other')||rest[0]).id,ok:'Sposta ed elimina categoria',danger:1});if(!dest)return}
 else if(!await ask({title:`Eliminare «${c.name}»?`,msg:'La categoria è vuota.',ok:'Elimina',danger:1}))return;
 if(dest)S.data.creds.forEach(x=>{if(x.cat===id)x.cat=dest});S.data.cats=S.data.cats.filter(x=>x.id!==id);await persist();S.view='cat:all';render();toast('Categoria eliminata.')}

/* ---------- Riordino (frecce e trascinamento) ---------- */
async function reorder(arr,id,tid){const a=arr.findIndex(x=>x.id===id),b=arr.findIndex(x=>x.id===tid);if(a<0||b<0||a===b)return;arr.splice(b,0,arr.splice(a,1)[0]);try{await persist()}catch{toast('Salvataggio non riuscito.','err')}render()}
const moveCat=(id,d)=>{const c=S.data.cats,n=c[c.findIndex(x=>x.id===id)+d];return n&&reorder(c,id,n.id)};
const stepCred=(id,d)=>{const l=visible(S.view.slice(4)),n=l[l.findIndex(x=>x.id===id)+d];return n&&reorder(S.data.creds,id,n.id)};
let drag=null;
document.addEventListener('dragstart',e=>{const t=e.target.closest?.('[data-cid],[data-catid]');if(!t)return;drag=t.dataset.cid?{k:'cid',id:t.dataset.cid}:{k:'catid',id:t.dataset.catid};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','');t.classList.add('dragging')});
document.addEventListener('dragover',e=>{if(!drag)return;const t=e.target.closest?.(`[data-${drag.k}]`);if(!t)return;e.preventDefault();document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));t.classList.add('over')});
document.addEventListener('drop',e=>{if(!drag)return;const t=e.target.closest?.(`[data-${drag.k}]`);if(!t)return;e.preventDefault();const d=drag;drag=null;reorder(d.k==='cid'?S.data.creds:S.data.cats,d.id,t.dataset[d.k])});
document.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.over,.dragging').forEach(x=>x.classList.remove('over','dragging'))});

/* ---------- Backup ---------- */
function exportBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S.rec,null,1)],{type:'application/json'}));a.download=`cassaforte-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup cifrato esportato.')}
async function doImport(file){try{const r=JSON.parse(await file.text());
 if(r.v!==1||r.kdf!=='PBKDF2-SHA256'||!Number.isInteger(r.iter)||r.iter<100000||r.iter>5e6||![r.salt,r.iv,r.ct].every(x=>typeof x==='string'))throw 0;
 const pw=await ask({title:'Password del backup',msg:'Inserisci la master password usata quando il backup è stato creato.',input:1,type:'password',ok:'Ripristina'});if(!pw)return;
 const key=await derive(pw,unb64(r.salt),r.iter),data=await open(key,r);if(!Array.isArray(data.cats)||!Array.isArray(data.creds))throw 0;
 if(S.data&&!await ask({title:'Sostituire i dati attuali?',msg:'Il ripristino sostituisce tutte le credenziali presenti con quelle del backup.',ok:'Sostituisci',danger:1}))return;
 const rec={v:1,kdf:r.kdf,iter:r.iter,salt:r.salt,iv:r.iv,ct:r.ct};await dbPut('vault',rec);data.settings??={lock:5};S.rec=rec;S.key=key;S.data=data;start();toast('Backup ripristinato.')}
 catch{toast('Backup non valido o password errata.','err')}}

/* ---------- Eventi ---------- */
const actions={
 view(t){S.view=t.dataset.v;S.q='';S.rev.clear();$('#side')?.classList.remove('open');render()},menu(){$('#side').classList.toggle('open')},
 theme(){const d=dark()?'light':'dark';document.documentElement.dataset.theme=d;try{localStorage.setItem('theme',d)}catch{}render()},lock(){lock('Cassaforte bloccata.')},
 add(){openForm()},open(t){openDetail(t.dataset.id)},edit(t){closeModal();openForm(t.dataset.id)},del(t){return delCred(t.dataset.id)},
 reveal(t){const i=t.dataset.id;S.rev.has(i)?S.rev.delete(i):S.rev.add(i);content()},
 cpass(t){return copy(S.data.creds.find(c=>c.id===t.dataset.id).pass,'Password')},cuser(t){return copy(S.data.creds.find(c=>c.id===t.dataset.id).user,'Utente')},
 layout(t){S.layout=t.dataset.l;content();document.querySelectorAll('[data-act=layout]').forEach(b=>b.classList.toggle('on',b.dataset.l===S.layout))},
 catnew:catNew,catup(t){return moveCat(t.dataset.id,-1)},catdown(t){return moveCat(t.dataset.id,1)},cup(t){return stepCred(t.dataset.id,-1)},cdown(t){return stepCred(t.dataset.id,1)},catren(t){return catRen(t.dataset.id)},catdel(t){return catDel(t.dataset.id)},
 mclose:tryClose,save(t){return save(t.dataset.id)},
 mreveal(t){const e=$('#m-pass');e.textContent=e.dataset.s?'••••••••••':S.data.creds.find(c=>c.id===t.dataset.id).pass;e.dataset.s=e.dataset.s?'':1;if(!e.dataset.s)delete e.dataset.s},
 fshow(){const p=$('#f-pass');p.type=p.type==='password'?'text':'password'},fcopy(t){const v=$('#'+t.dataset.t).value;return v&&copy(v,t.dataset.t==='f-pass'?'Password':'Utente')},
 fgen(){const g=$('#gp');g.hidden=!g.hidden;if(!g.hidden){g.innerHTML=genPanel()+'<button class="btn" data-act="guse" style="margin-bottom:12px">Usa questa password</button>';genRun()}},
 guse(){const p=$('#f-pass');p.value=S.gout;p.type='text';meter('f-bar','f-lab',S.gout);dirty=true;$('#gp').hidden=true},
 gregen:genRun,gcopy(){return copy(S.gout,'Password')},export:exportBackup,import(){$('#imp').click()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&actions[t.dataset.act])actions[t.dataset.act](t)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){S.q=t.value;if(S.view.startsWith('cat:'))content();else{S.view='cat:all';S.focusQ=1;render()}}
 else if(t.dataset.gen){const k=t.dataset.gen;S.gen[k]=k==='len'?+t.value:t.checked?1:0;if(k==='len')$('#g-lv').textContent=t.value;genRun();return}
 else if(t.id==='f-pass')meter('f-bar','f-lab',t.value);else if(t.id==='a-pw')meter('a-bar','a-lab',t.value);
 if(t.closest('#modal'))dirty=true});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='sort'){S.sort=t.value;content()}else if(t.id==='lockm'){S.data.settings.lock=+t.value;await persist();toast('Impostazione salvata.')}
 else if(t.id==='imp'&&t.files[0]){const f=t.files[0];t.value='';doImport(f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML&&!$('#dialog').innerHTML)tryClose()});
['mousemove','keydown','click','touchstart'].forEach(v=>addEventListener(v,()=>last=Date.now(),{passive:true}));
setInterval(()=>{const m=S.data?.settings.lock;if(S.key&&m&&Date.now()-last>m*60000)lock('Cassaforte bloccata per inattività.')},5000);
(async()=>{try{const th=localStorage.getItem('theme');if(th)document.documentElement.dataset.theme=th}catch{}
 try{S.rec=await dbGet('vault')||null}catch{toast('IndexedDB non disponibile: impossibile usare la cassaforte.','err')}
 if(!crypto?.subtle)toast('Web Crypto non disponibile: apri il file da localhost o https.','err');render()})();
</script>
